<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Groww SIP Care · Concept</title>
<meta name="description" content="Concept prototype for a Groww product case study: SIP Care, an AI agent that answers any SIP question from your own account and the SIP rules, does safe steps itself and asks you before anything else. Not an official Groww product.">
<meta name="theme-color" content="#00b386">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1b1f2a;--muted:#6b7280;--line:#e5e7eb;--subtle:#f5f7f8;--green:#00b386;--green-ink:#00865f;--green-bg:#e6f7f1;--amber:#b45309;--amber-bg:#fef3c7;--blue:#2563eb;--blue-bg:#eaf1fd;--r:14px;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1217;--card:#161b22;--ink:#e8edf3;--muted:#9aa6b4;--line:#283140;--subtle:#1c232d;--green:#2ccb98;--green-ink:#3ddcab;--green-bg:#123128;--amber:#f0a35a;--amber-bg:#35261a;--blue:#7fb0ea;--blue-bg:#1b2a3d;--on:#04261b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.msi{width:22px;height:22px;display:inline-block;vertical-align:middle;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msi.fill{fill:currentColor;stroke:none}
.msi.fill .cut{stroke:var(--card);fill:none;stroke-width:2.2}
.chip .msi{width:14px;height:14px}.sc .msi{width:16px;height:16px}.receipt .msi{width:18px;height:18px}.step .b .msi{width:16px;height:16px}.halo .msi{width:40px;height:40px}
nav.bottom .msi{width:22px;height:22px}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin .8s linear infinite}
.phone{max-width:430px;min-height:100vh;margin:0 auto;background:var(--card);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--line)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid transparent}
.top.inner{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.word{font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--green)}
.concept{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--subtle);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--subtle);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--card)}
.ttl{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
main{flex:1;padding:4px 16px 96px;display:flex;flex-direction:column;gap:14px}
h2{font-size:20px;margin:6px 0 0;font-weight:600}
h3{font-size:16px;margin:0;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.value .big{font-size:26px;font-weight:600;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px}
.ok{color:var(--green-ink);background:var(--green-bg)}.warn{color:var(--amber);background:var(--amber-bg)}.info{color:var(--blue);background:var(--blue-bg)}.mutedc{color:var(--muted);background:var(--subtle)}
.issue{background:var(--amber-bg);border:0;position:relative;overflow:hidden}
.issue h3{color:var(--amber)}
.issue .safe{background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;margin:10px 0}
.success{background:var(--green-bg);border:0}
.agentbadge{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.sc{width:26px;height:26px;border-radius:8px;background:var(--green);color:var(--on);display:flex;align-items:center;justify-content:center}
.aitag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--green-ink);background:var(--green-bg);border-radius:6px;padding:2px 6px}
.stdtag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--subtle);border-radius:6px;padding:2px 6px}
.newtag{font-size:10px;font-weight:700;color:var(--on);background:var(--green);border-radius:5px;padding:1px 5px;margin-left:6px}
.btn{height:46px;border-radius:10px;border:0;background:var(--green);color:var(--on);font:inherit;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.sec{background:transparent;color:var(--green-ink);border:1px solid var(--green)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.qa button{background:none;border:0;color:var(--ink);font:inherit;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default}
.qa button.live{cursor:pointer}
.qa .tile{width:50px;height:50px;border-radius:14px;background:var(--subtle);display:flex;align-items:center;justify-content:center;color:var(--green-ink);position:relative}
.qa .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.row{display:flex;align-items:center;gap:12px}
.fund{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}
.fi{width:40px;height:40px;border-radius:10px;background:var(--subtle);color:var(--green-ink);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.fund .name{font-weight:500;font-size:14px}
.sectionh{display:flex;justify-content:space-between;align-items:center}
.link{color:var(--green-ink);font-weight:600;font-size:13px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
nav.bottom{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.bottom div.on{color:var(--green-ink)}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px}
.msg.user{align-self:flex-end;background:var(--green);color:var(--on);border-bottom-right-radius:4px}
.msg.agent{align-self:flex-start;background:var(--subtle);border-bottom-left-radius:4px}
.msg .meta{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.receipt{align-self:flex-start;font-size:13px;color:var(--green-ink);display:flex;gap:6px;align-items:flex-start}
.notice{font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:10px;padding:8px 10px}
.prop{border:1px solid var(--green);background:var(--green-bg);border-radius:12px;padding:12px;align-self:stretch}
.prop.danger{border-color:var(--line);background:var(--subtle)}
.prop .t{font-weight:600;font-size:14px}
.prop .s{font-size:13px;color:var(--muted);margin-top:2px}
.composer{position:sticky;bottom:64px;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:15}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.inp{display:flex;gap:8px}
.inp input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--subtle);color:var(--ink);font:inherit;padding:0 12px}
.inp button{width:44px;height:44px;border-radius:12px;border:0;background:var(--green);color:var(--on);cursor:pointer}
.lang{display:flex;background:var(--subtle);border-radius:999px;padding:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:5px 8px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,20,25,.45)}
.sheet{width:100%;max-width:430px;background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px 20px;max-height:88vh;overflow:auto}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.kv{border:1px solid var(--line);border-radius:12px;margin-top:10px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13px;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:500;text-align:right}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex:none}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:10px;align-items:flex-start;animation:rise .35s ease both}
.step .b{width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 0}
.halo{width:80px;height:80px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;color:var(--green)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.fb button.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.fb button.opt[aria-pressed=true]{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.foot{display:flex;justify-content:center;gap:16px;padding:4px 0 8px}
.hidden{display:none!important}

.nbadge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--card)}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green-bg);border-radius:12px;padding:10px 12px;margin-top:4px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent);animation:pl 1.8s infinite;flex:none}
.pulse.off{animation:none;background:var(--muted)}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;height:32px;padding:0 10px;font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.pill .msi{width:16px;height:16px}
.obs{display:flex;gap:10px;align-items:flex-start;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer;text-align:left}
.obs.needs{border-color:var(--amber)}
.issue .obs{background:var(--card)}
.oi{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.oi .msi{width:18px;height:18px}
.obs .chev{width:18px;height:18px;color:var(--muted);margin-top:8px}
.trace{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.trace span{display:inline-flex;align-items:center;gap:4px}
.trace span i{display:inline-block;width:14px;height:1px;background:var(--line);margin-right:2px}
.trace span b{width:18px;height:18px;border-radius:50%;background:var(--subtle);display:inline-flex;align-items:center;justify-content:center}
.trace span b .msi{width:12px;height:12px}
.trace span.on{color:var(--green-ink);font-weight:600}.trace span.on b{background:var(--green);color:var(--on)}
.an{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.an h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.an h4 .msi{width:16px;height:16px}
.an p{margin:0;font-size:14px}
.an ul{margin:0;padding-left:18px;font-size:14px}.an li{margin:3px 0}
.an.needs{border-color:var(--green);background:var(--green-bg)}
.an .receipt{margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--muted)}
.dayh{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
#toasts{position:fixed;top:8px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px}
.toast{pointer-events:auto;width:100%;max-width:410px;display:flex;gap:10px;align-items:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);font:inherit;cursor:pointer;animation:drop .35s ease both;transition:opacity .4s,transform .4s}
.toast b{display:block;font-size:13px}.toast span span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.dotu{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none;margin-top:6px}
.top .ttl .aitag{margin-left:2px}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.topic{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:13px;font-weight:600;text-align:left;cursor:pointer;min-height:56px}
.topic .oi{background:var(--green-bg);color:var(--green-ink)}
.topic:active{background:var(--subtle)}
.ans{align-self:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ans .hd{display:flex;gap:6px;align-items:center;padding:10px 12px;background:var(--subtle);font-size:12px;font-weight:600}
.ans .bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.ans h4{margin:0 0 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.ans h4 .msi{width:14px;height:14px}
.ans ul{margin:0;padding-left:18px;font-size:13px}.ans li{margin:2px 0}
.ans p{margin:0;font-size:14px}
.work{align-self:stretch;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.work div{display:flex;gap:8px;align-items:center;color:var(--muted)}.work div.on{color:var(--ink)}.work div.ok{color:var(--green-ink)}
.work .msi{width:16px;height:16px}
.fups{display:flex;gap:6px;flex-wrap:wrap}
.fups button{border:1px solid var(--green);background:var(--card);color:var(--green-ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pf div span{display:block;font-size:12px;color:var(--muted)}.pf div b{font-size:15px}
.up{color:var(--green-ink)}.down{color:#d55}
.sipmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--muted)}
.sipmeta b{color:var(--ink);font-weight:500}
.rowbtn{display:block;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
details.tester{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px}
details.tester summary{cursor:pointer;font-weight:600;font-size:14px}

/* ---------- website layout ---------- */
.phone{max-width:none;margin:0;box-shadow:none;background:var(--bg);min-height:100vh}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.wrap.narrow{max-width:860px}
.sitehead{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.sitehead>.wrap{height:64px}
.sitehead .brand{border:0;background:none;cursor:pointer;padding:0;font:inherit}
.topnav{display:flex;gap:4px}
.topnav button{position:relative;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:22px 12px;cursor:pointer;border-bottom:2px solid transparent}
.topnav button:hover{color:var(--ink)}
.topnav button.on{color:var(--green-ink);border-bottom-color:var(--green)}
.navbadge{margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.searchbox{display:flex;align-items:center;gap:6px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--subtle);color:var(--muted);width:240px}
.searchbox input{border:0;background:none;font:inherit;color:var(--ink);flex:1;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green-bg);color:var(--green-ink);font-weight:700;display:flex;align-items:center;justify-content:center}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;padding-bottom:4px}
.pagehead .ttl{font-size:22px;margin:0;display:flex;align-items:center;gap:8px}
.pagehead .back{display:inline-flex;align-items:center;gap:4px}
.crumb{color:var(--line)}
main.wrap{padding-top:16px;padding-bottom:48px;display:flex;flex-direction:column;gap:16px;flex:1}
.dashhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.colmain,.colside{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.tablewrap{overflow-x:auto;margin-top:8px}
.siptable{width:100%;border-collapse:collapse;font-size:14px}
.siptable th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.siptable td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.siptable tbody tr{cursor:pointer}
.siptable tbody tr:hover{background:var(--subtle)}
.siptable .num{text-align:right;white-space:nowrap}
.carews{display:grid !important;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.careside{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.topics.one{grid-template-columns:1fr}
.carepanel{display:flex;flex-direction:column;gap:14px;min-height:560px}
.carepanel .thread{flex:1}
.composer{position:sticky;bottom:0;border-top:1px solid var(--line);margin:0 -16px -16px;padding:12px 16px;border-radius:0 0 var(--r) var(--r)}
.msg{max-width:72%}
.sheetwrap{align-items:center}
.sheet{max-width:560px;border-radius:16px;max-height:86vh}
.handle{display:none}
#toasts{top:76px;left:auto;right:20px;align-items:flex-end;width:420px;max-width:calc(100vw - 32px)}

  .siptable thead{display:none}.siptable tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}.siptable td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 4px}.siptable td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12px}.siptable .num{text-align:right}
  .msg{max-width:88%}.sheetwrap{align-items:flex-end}.sheet{border-radius:20px 20px 0 0}#toasts{right:8px;left:8px;width:auto}}

<body>
<div class="phone" id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IC = {

  verified_user: '<path d="M12 3 4 6v6c0 5 3.4 8.6 8 9.5 4.6-.9 8-4.5 8-9.5V6z"/><path class="cut" d="m8.5 12 2.5 2.5 4.5-5"/>',

  auto_fix_high: '<path d="m4 20 11-11 2 2L6 22z"/><path d="M15 4v3M13.5 5.5h3M20 9v2M19 10h2M19 2v2M18 3h2"/>',
  calendar_month: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',

  block: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  pause_circle: '<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
  health_and_safety: '<path d="M12 3 4 6v6c0 5 3.4 8.6 8 9.5 4.6-.9 8-4.5 8-9.5V6z"/><path d="M12 9v6M9 12h6"/>',
  arrow_forward: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  arrow_back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  send: '<path d="m4 12 16-8-6 16-2.5-6.5z"/><path d="M20 4 11.5 13.5"/>',

  task_alt: '<path d="M21 11.1V12a9 9 0 1 1-5.3-8.2"/><path d="m9 11 3 3 9-9"/>',
  progress_activity: '<path d="M21 12a9 9 0 1 1-9-9"/>',
  home: '<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  explore: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  pie_chart: '<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
};
const FILLABLE = { home: 1, check_circle: 1, verified_user: 1 };
const ic = (n, cls = "") => { const fill = /fill/.test(cls) && FILLABLE[n]; const spin = n === "progress_activity" ? " spin" : ""; return `<svg class="msi ${fill ? "fill" : ""}${spin} ${cls.replace("fill", "")}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || IC.info}</svg>`; };

IC.radar = '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18 6"/>';
IC.skip_next = '<path d="m5 5 9 7-9 7z"/><path d="M19 5v14"/>';
IC.play = '<path d="m7 5 12 7-12 7z"/>';
IC.pause = '<path d="M8 5v14M16 5v14"/>';
IC.analytics = '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>';
IC.notifications_active = IC.notifications + '<path d="M2 8c0-2 1-4 2.5-5.5M22 8c0-2-1-4-2.5-5.5"/>';
IC.bubble = '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/>';

IC.payments = '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>';
IC.visibility_off = '<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3 3.6M6.3 7.7A16 16 0 0 0 2.5 12s3.5 6 9.5 6a9.6 9.6 0 0 0 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
IC.trending_up = '<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>';
IC.wallet = '<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.2"/>';
IC.percent = '<path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>';
IC.edit = '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>';
IC.help = '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/>';
IC.manage = '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>';
IC.doc = '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>';
IC.flask = '<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/>';

const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const post = async (p, b) => { try { const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b || {}) }); return await r.json(); } catch (e) { return { ok: false, error: "Can't reach SIP Care right now. Check your connection." }; } };
const inr = n => (n < 0 ? "-" : "") + "₹" + Math.abs(Math.round(Number(n))).toLocaleString("en-IN");
const nth = n => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
const hm = iso => { try { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } };

const S = { session: store.get("sipcare_session"), view: null, pending: [], gate: null, situations: [], chat: [], busy: false, work: 0, steps: [], lastFix: null, fbDone: store.get("sipcare_fb") === "1", lastTickAt: 0, nextTickMs: 12000, lang: store.get("sipcare_lang") || "en", seenObs: new Set(), flowRes: {}, flowDone: {}, returnTo: "" };

// What the user can pick in SIP Care (they can also type anything).
const TOPICS = [
  ["payments", "Payment failed", { en: "My SIP payment failed. What happened and what should I do?", hinglish: "Meri SIP payment fail ho gayi. Kya hua aur ab kya karu?", hi: "मेरी SIP की पेमेंट फेल हो गई। क्या हुआ और अब क्या करूँ?" }],
  ["visibility_off", "Not showing in app", { en: "Money was debited but my investment is not showing in the app.", hinglish: "Paisa kat gaya par investment app mein nahi dikh raha.", hi: "पैसा कट गया पर निवेश ऐप में नहीं दिख रहा।" }],
  ["block", "Stop or close a SIP", { en: "I want to stop my SIP. What happens to my money?", hinglish: "Mujhe SIP band karni hai. Mere paise ka kya hoga?", hi: "मुझे SIP बंद करनी है। मेरे पैसे का क्या होगा?" }],
  ["trending_up", "When will it grow?", { en: "When will my invested money grow?", hinglish: "Mera invested paisa kab badhega?", hi: "मेरा निवेश किया पैसा कब बढ़ेगा?" }],
  ["wallet", "Withdraw money", { en: "When and how can I withdraw my money?", hinglish: "Main apna paisa kab aur kaise nikal sakta hoon?", hi: "मैं अपना पैसा कब और कैसे निकाल सकता हूँ?" }],
  ["percent", "Tax & exit load", { en: "Will I pay tax or exit load if I withdraw now?", hinglish: "Abhi paisa nikalun to tax ya exit load lagega?", hi: "अभी पैसा निकालूँ तो टैक्स या एग्ज़िट लोड लगेगा?" }],
  ["edit", "Change date or amount", { en: "How can I change my SIP date or amount?", hinglish: "SIP ki date ya amount kaise badlun?", hi: "SIP की तारीख या रकम कैसे बदलूँ?" }],
  ["pause_circle", "Skip or pause", { en: "Can I skip or pause my SIP for a month?", hinglish: "Kya main ek mahine ke liye SIP skip ya pause kar sakta hoon?", hi: "क्या मैं एक महीने के लिए SIP रोक सकता हूँ?" }],
  ["bolt", "AutoPay", { en: "Is my AutoPay working for all my SIPs?", hinglish: "Kya meri sab SIP ka AutoPay chal raha hai?", hi: "क्या मेरी सभी SIP का AutoPay चालू है?" }],
  ["shield", "Is my money safe?", { en: "Is my money safe?", hinglish: "Kya mera paisa safe hai?", hi: "क्या मेरा पैसा सुरक्षित है?" }],
];
const TOPIC_LABEL = { payment_failed: "Payment", not_reflecting: "Not showing in app", stop_sip: "Stop or close", growth: "Growth", withdraw: "Withdrawal", tax: "Tax", exit_load: "Exit load", change_sip: "SIP change", autopay: "AutoPay", missed_instalment: "Missed instalment", is_money_safe: "Safety", will_sip_cancel: "SIP cancellation", status: "SIP status", how_to: "How it works", out_of_scope: "Outside SIP Care", unclear: "Question", greeting: "Hello" };
const LINKS = { sip: ["calendar_month", (v, id) => `Open ${short(v, id)} SIP`, id => "sip/" + id], autopay: ["bolt", () => "Open AutoPay settings", id => "autopay/" + id], orders: ["receipt_long", () => "Open payments & orders", () => "orders"], support: ["help", () => "Open support", () => "support"], bank: ["wallet", () => "Open bank account", () => "bank"], withdraw: ["wallet", (v, id) => `Open withdraw (${short(v, id)})`, id => "withdraw/" + id], portfolio: ["pie_chart", () => "Open portfolio", () => "portfolio"] };
const short = (v, id) => { const s = v && v.sips.find(x => x.id === id); return s ? s.fund.replace(/ Fund.*| \(Demo\)/g, "") : "this"; };
const sipOf = id => S.view && S.view.sips.find(x => x.id === id);
const KIND_ICON = { refunded: ["wallet", "ok"], payment_failed: ["payments", "warn"], salary_in: ["wallet", "warn"], sip_debited: ["check_circle", "ok"], units_pending: ["visibility_off", "warn"], autopay_expired: ["bolt", "warn"], units_allotted: ["check_circle", "ok"], redemption_credited: ["wallet", "ok"], sip_stopped: ["block", "mutedc"], autopay_active: ["bolt", "ok"] };

// Website layout: one top navigation bar for every page, a footer, no mobile tab bar.
function navBar() {
  return `<footer class="sitefoot"><div class="wrap row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><span class="muted">Concept prototype for a Groww case study · not an official Groww product · demo data · not investment advice</span><span class="row" style="gap:16px"><a class="link" href="/quality" target="_blank" rel="noopener">How SIP Care is tested</a><button class="link" data-act="reset">Restart demo</button></span></div></footer>`;
}
function siteHeader() {
  const v = S.view;
  const cur = screen.split("/")[0];
  const items = [["home", "Dashboard"], ["sips", "SIPs"], ["orders", "Orders"], ["care", "SIP Care"], ["bank", "Account"]];
  const on = k => cur === k || (k === "sips" && ["sip", "autopay", "withdraw", "cancel", "fix"].includes(cur)) || (k === "care" && cur === "note") || (k === "home" && cur === "portfolio");
  const badge = v && v.needs_you.length ? `<span class="navbadge">${v.needs_you.length}</span>` : "";
  return `<header class="sitehead"><div class="wrap row" style="justify-content:space-between;gap:16px">
    <div class="row" style="gap:28px;min-width:0"><button class="brand" data-go="home" aria-label="Groww concept home"><span class="word">Groww</span><span class="concept">Concept</span></button>
      <nav class="topnav" aria-label="Main">${items.map(([k, l]) => `<button class="${on(k) ? "on" : ""}" data-go="${k}">${l}${k === "care" ? badge : ""}</button>`).join("")}</nav></div>
    <div class="row" style="gap:10px"><label class="searchbox">${ic("search")}<input placeholder="Search Groww…" aria-label="Search (not active in this prototype)" disabled></label>
      <button class="iconbtn" aria-label="Notifications" data-go="inbox">${ic("notifications")}${v && v.unread ? `<span class="nbadge">${v.unread}</span>` : ""}</button>
      <span class="avatar" title="Riya (demo)">R</span></div></div></header>`;
}
const topHome = () => siteHeader();
function topInner(title, extra) {
  return `${siteHeader()}<div class="wrap pagehead"><div class="row" style="gap:10px;min-width:0"><button class="link back" data-go="back">${ic("arrow_back")} Back</button><span class="crumb">/</span><h1 class="ttl">${title}</h1></div>${extra || ""}</div>`;
}
function agentStrip() {
  const v = S.view;
  const n = v.needs_you.length;
  return `<div class="strip"><div class="row" style="gap:10px;min-width:0"><span class="pulse ${v.autoplay ? "" : "off"}"></span><div style="min-width:0"><div style="font-weight:600;font-size:13px">${n ? `SIP Care found ${n} thing${n > 1 ? "s" : ""} to look at` : "All SIPs on track"}</div><div class="muted" style="font-size:12px">SIP Care ${v.autoplay ? "is checking in the background" : "checks are paused"}${v.last_check ? " · last check " + hm(v.last_check) : ""}</div></div></div>
    <button class="pill" data-act="toggle" aria-label="${v.autoplay ? "Pause" : "Resume"} background checks">${ic(v.autoplay ? "pause" : "play")}</button></div>`;
}
function fundRow(s) {
  const tone = { ok: "ok", warn: "warn", info: "info", muted: "mutedc" }[s.tone] || "mutedc";
  const g = s.value - s.invested;
  return `<div class="fund" style="align-items:flex-start"><div class="fi">${esc(s.fund[0])}</div><div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between;gap:8px;align-items:flex-start"><div class="name">${esc(s.fund)}</div><span class="chip ${tone}" style="white-space:nowrap">${esc(s.label)}</span></div>
    <div class="muted">${inr(s.amount)} monthly · ${nth(s.day)} of every month${s.skip_next ? " · next skipped" : ""}</div>
    <div class="sipmeta"><span>Last invested <b>${esc(s.last_invested)}</b></span><span>Next <b>${esc(s.next)}</b></span><span>Invested <b>${inr(s.invested)}</b></span><span>Current <b class="${g >= 0 ? "up" : "down"}">${inr(s.value)}</b></span></div></div></div>`;
}
function noteCard(o, compact) {
  const [i, t] = KIND_ICON[o.kind] || ["radar", "ok"];
  const st = o.status === "open" ? '<span class="chip warn">Needs your decision</span>' : o.status === "in_progress" ? `<span class="chip info">${ic("schedule")}Being fixed</span>` : o.status === "resolved" ? `<span class="chip ok">${ic("check_circle")}Resolved</span>` : "";
  return `<button class="obs ${o.status === "open" ? "needs" : ""}" data-note="${o.id}"><span class="oi ${t}">${ic(i)}</span><span style="flex:1;min-width:0;text-align:left"><b style="font-size:14px">${esc(o.title)}</b>${compact ? "" : `<span class="muted" style="display:block;margin-top:2px">${esc(o.notify)}</span>`}${st ? `<span class="row" style="margin-top:6px">${st}</span>` : ""}</span>${ic("arrow_forward", "chev")}</button>`;
}

// ---------------- HOME (normal account) ----------------
function home() {
  const v = S.view; if (!v) return loading();
  const needs = v.needs_you;
  const latest = v.observations.filter(o => o.status !== "open").slice(0, 4);
  const g = v.gain, pct = v.invested ? (g / v.invested * 100) : 0;
  const success = S.lastFix ? `<div class="card success" id="successCard"><div class="row" style="justify-content:space-between"><span class="sc" style="width:32px;height:32px;border-radius:50%">${ic("check")}</span><span class="aitag">AI agent</span></div><h3 style="margin-top:10px">Done by SIP Care</h3><p style="margin:6px 0 0;font-size:14px">${esc(S.lastFix.replace(/^SIP Care: /, ""))}</p><p class="muted" style="margin:6px 0 0">SIP Care will follow up and notify you when it's complete.</p></div>` : "";
  const needsBlock = needs.length ? `<div class="card issue"><div class="row" style="align-items:flex-start"><span class="chip warn" style="padding:6px;border-radius:50%">${ic("info")}</span><div><h3>SIP Care spotted ${needs.length > 1 ? needs.length + " things" : "something"}</h3><div style="font-size:13px;color:var(--amber);margin-top:2px">Your invested money is safe. Click to see what happened and what you can do.</div></div></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${needs.map(o => noteCard(o)).join("")}</div></div>` : "";
  return `${topHome()}
  <main class="wrap dash">
    <div class="dashhead"><div><h1 style="margin:0;font-size:26px">Hi ${esc(v.user)}</h1><div class="muted">Your mutual fund dashboard</div></div>${v.demo_date ? `<span class="chip info">Demo date ${esc(v.demo_date)}</span>` : ""}</div>
    ${agentStrip()}
    <div class="cols">
    <section class="colmain">
    ${success}
    ${needsBlock}
    ${S.lastFix && !S.fbDone ? feedbackCard() : ""}
    <div class="card value"><div class="muted" style="font-weight:500">Mutual funds · current value</div><div class="row" style="gap:8px;margin-top:6px;align-items:baseline"><span class="big">${inr(v.value)}</span><span class="${g >= 0 ? "up" : "down"}" style="font-weight:600;font-size:13px">${g >= 0 ? "+" : ""}${inr(g)} (${pct.toFixed(2)}%)</span></div>
      <div class="pf"><div><span>Invested</span><b>${inr(v.invested)}</b></div><div><span>Last SIP date</span><b>${esc(v.last_sip)}</b></div></div>
      <div class="muted" style="margin-top:8px">${v.active_sips} active SIPs · next instalment ${esc(v.next_sip)}</div></div>
    <div class="card"><div class="sectionh"><h3>Your SIPs</h3><button class="link" data-go="sips">Manage SIPs ${ic("arrow_forward")}</button></div>${sipTable(v)}</div>
    </section>
    <aside class="colside">
    <div class="card"><div class="row" style="justify-content:space-between"><div class="agentbadge"><span class="sc">${ic("shield_with_heart")}</span>Ask SIP Care</div><span class="aitag">AI agent</span></div>

async function proposeAndConfirm(a) {

// ---------------- GUIDED FLOWS: the result shows on its own screen, not in the chat ----------------
async function runFlow(flow) {
  const key = flow.kind + ":" + flow.sip_id;
  S.flowRes[key] = { loading: true, flow }; S.work = 0; render();
  const timer = setInterval(() => { if (S.work < 2) { S.work++; const w = document.querySelector(".work"); if (w) w.outerHTML = workBox(); } }, 700);
  const r = await post("/api/agent/message", { session_id: S.session, flow, lang: S.lang });
  clearInterval(timer);
  S.flowRes[key] = r.ok ? r : { error: r.error || "Something went wrong.", flow };
  if (r.ok) { S.pending = r.pending; S.view = r.view; }
  render();
}
function stepList(r, key) {
  const steps = [];
  (r.done || []).forEach(d => steps.push(`<div class="step"><span class="b">${ic("check")}</span><div><b style="font-size:14px">${esc(d)}</b><div class="muted">Done automatically</div></div></div>`));
  (r.proposals || []).forEach((p, i) => { const live = S.pending.some(x => x.id === p.id); const st = (S.flowDone[p.id]); steps.push(`<div class="prop ${p.danger ? "danger" : ""}" style="${p.danger ? "" : ""}"><div class="t">${p.danger ? "" : `Step ${i + 1}: `}${esc(p.title)}</div><div class="s">${esc(p.summary)}</div>${live ? `<div class="row" style="gap:8px;margin-top:10px"><button class="btn ${p.danger ? "sec" : ""}" style="height:38px" data-confirm="${p.id}">${p.danger ? "Cancel anyway" : "Do this"}</button>${p.danger ? "" : `<button class="btn ghost" style="height:38px;width:auto;padding:0 12px" data-decline="${p.id}">Not now</button>`}</div>` : `<div class="muted" style="margin-top:6px">${st === "declined" ? "Not done" : "✓ Done"}</div>`}</div>`); });
  return steps.join("");
}

    <section class="an"><h4>${ic("verified_user")} ${r.flow && r.flow.kind === "fix" ? "Why it failed and the fix" : "SIP Care's recommendation"} ${r.used_ai ? '<span class="aitag">AI</span>' : '<span class="stdtag">Standard</span>'}</h4><p>${esc(r.answer)}</p></section>

// ---------------- notifications ----------------
function toast(o) {
  const el = document.createElement("button");
  el.className = "toast"; el.innerHTML = `<span class="sc">${ic("shield_with_heart")}</span><span style="flex:1;text-align:left"><b>${/^SIP Care/.test(o.title) ? "" : "SIP Care · "}${esc(o.title)}</b><span>${esc(o.notify)}</span></span>`;
  el.onclick = () => { el.remove(); if (o.id) go("note/" + o.id); };
  $("#toasts").appendChild(el);
  setTimeout(() => el.classList.add("out"), 5500); setTimeout(() => el.remove(), 6000);
}
async function systemNotify(o) {
  if (!("Notification" in window) || Notification.permission !== "granted" || document.visibilityState === "visible") return;
  try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) reg.showNotification((/^SIP Care/.test(o.title) ? "" : "SIP Care · ") + o.title, { body: o.notify, icon: "/icon.svg", tag: o.id, data: { url: "/#/note/" + o.id } }); } catch (e) {}
}
function announce(fresh) { const f = (fresh || []).filter(o => !S.seenObs.has(o.id)); f.forEach(o => S.seenObs.add(o.id)); const top = f.find(o => o.level === "alert") || f[0]; if (top) { toast(top); systemNotify(top); } }
async function enableAlerts() {
  const msg = t => { const m = $("#alertsMsg"); if (m) m.textContent = t; };
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) { msg("This browser doesn't support alerts. Use Chrome, Edge or Firefox; on iPhone, add this page to your Home Screen first."); return; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { msg("Alerts are blocked. Allow notifications for this site in your browser settings."); return; }
  try {
    const reg = await navigator.serviceWorker.register("/sw.js"); await navigator.serviceWorker.ready;
    const k = await (await fetch("/api/agent/push-key")).json();
    const key = Uint8Array.from(atob(k.key.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.key.length + 3) % 4)), c => c.charCodeAt(0));
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const r = await post("/api/agent/push-subscribe", { session_id: S.session, subscription: sub.toJSON() });
    if (!r.ok) throw new Error(r.error);
    store.set("sipcare_push", "1"); render();
    reg.showNotification("SIP Care alerts are on", { body: "SIP Care will alert you here when something changes on your SIPs, even with the app closed.", icon: "/icon.svg" });
  } catch (e) { msg("Couldn't turn on alerts: " + (e.message || e)); }
}

// ---------------- data + loop ----------------
function apply(r) { if (!r || !r.ok) return; S.view = r.view; S.pending = r.pending || []; if (r.gate) S.gate = r.gate; if (r.situations) S.situations = r.situations; if (r.next_tick_ms) S.nextTickMs = r.next_tick_ms; }
const DEMO = (new URLSearchParams(location.search).get("demo") || "").replace(/-/g, "_");
const CAUSES = ["sip_low_balance", "sip_autopay", "sip_not_approved", "sip_mandate_limit", "sip_mandate_cancelled", "sip_bank_error", "sip_debited"];
// Each visit or refresh shows a different payment problem (never the same one twice in a row).
function nextCause() { const last = store.get("sipcare_last_cause"); const pool = CAUSES.filter(c => c !== last); const c = pool[Math.floor(Math.random() * pool.length)]; store.set("sipcare_last_cause", c); return c; }
async function start(reset, scenario) {
  const sc = scenario || (DEMO === "normal" ? "normal" : DEMO ? "sip_" + DEMO.replace(/^sip_/, "") : reset ? nextCause() : undefined);
  const r = await post("/api/agent/start", { session_id: reset ? "" : S.session, reset: !!reset, lang: S.lang, scenario: sc });
  if (!r.ok) { $("#app").innerHTML = `<main><div class="notice" style="margin-top:20px">${esc(r.error || "Can't load the demo.")}</div></main>`; return false; }
  S.session = r.session_id; store.set("sipcare_session", r.session_id);
  if (reset) { $("#toasts").innerHTML = ""; S.flowRes = {}; S.flowDone = {}; S.chat = []; S.lastFix = null; S.fbDone = false; store.set("sipcare_fb", "0"); S.seenObs = new Set(); }
  apply(r); S.lastTickAt = Date.now();
  (r.view.observations || []).forEach(o => { if (!(r.fresh || []).some(f => f.id === o.id)) S.seenObs.add(o.id); });
  setTimeout(() => announce(r.fresh), 400);
  return true;
}
async function tick(force) {
  if (!S.session) return;
  S.lastTickAt = Date.now();
  const r = await post("/api/agent/tick", { session_id: S.session, force: !!force });
  if (!r.ok) return;
  const hadSheet = !!$("#sheet"), typing = document.activeElement && document.activeElement.id === "q";
  apply(r); announce(r.fresh);
  if (!hadSheet && !typing && screen !== "fixing" && !S.busy) render();
}
setInterval(() => { if (S.view && S.view.autoplay && Date.now() - S.lastTickAt >= S.nextTickMs) tick(false); }, 2000);
const ROUTES = /^(home|care|inbox|sips|orders|support|bank|portfolio|(note|sip|autopay|withdraw|cancel|fix)\/[\w]+)$/;
window.addEventListener("hashchange", () => { const h = location.hash.replace(/^#\//, "") || "home"; if (h !== screen && S.view && ROUTES.test(h)) go(h); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view && S.view.autoplay) tick(false); });

async function send(message, flow, shown) {
  if (S.busy) return;
  if (screen !== "care") { if (flow) S.chat = []; go("care"); }
  S.busy = true; S.work = 0; S.chat.push({ kind: "user", text: shown || message }); render(); scrollEnd();
  const timer = setInterval(() => { if (S.work < 2) { S.work++; const w = document.querySelector(".work"); if (w) w.outerHTML = workBox(); } }, 700);
  const r = await post("/api/agent/message", { session_id: S.session, message: flow ? "" : message, flow, lang: S.lang });
  clearInterval(timer); S.busy = false;
  if (!r.ok) { S.chat.push({ kind: "notice", text: r.error || "Something went wrong." }); render(); return; }
  if (r.shown && !flow) { const u = [...S.chat].reverse().find(x => x.kind === "user"); if (u) u.text = r.shown; }
  if (r.redacted && r.redacted.length) S.chat.push({ kind: "notice", text: `We removed what looked like your ${r.redacted.join(", ")}. Please don't share these.` });
  if (r.notice) S.chat.push({ kind: "notice", text: r.notice });
  S.chat.push({ kind: "answer", r });
  S.pending = r.pending; S.view = r.view; render(); scrollEnd();
}

// ---------------- router ----------------
let screen = "home", backStack = [];
function go(s) {
  if (s === "portfolio") s = "home";
  if (s === "back") { s = backStack.pop() || "home"; } else if (s !== screen) backStack.push(screen);
  if (s === "home") backStack = [];
  screen = s; try { history.replaceState(null, "", s === "home" ? "#/" : "#/" + s); } catch (e) {}
  if (s.startsWith("note/")) markRead(s.slice(5));
  if (s === "inbox") post("/api/agent/settings", { session_id: S.session, read: "all" }).then(apply);
  render(); window.scrollTo(0, 0); if (s === "fixing") runSteps();
}
function markRead(obsId) { const v = S.view; if (!v) return; const ids = v.inbox.filter(n => n.obs_id === obsId && !n.read).map(n => n.id); if (ids.length) post("/api/agent/settings", { session_id: S.session, read: ids }).then(r => { apply(r); }); }
function loading() { return `<main><div class="hero" style="margin-top:40vh"><span class="typing"><i></i><i></i><i></i></span></div></main>`; }
function scrollEnd() { setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 30); }
function render() {
  const s = screen;
  const [a, id] = s.split("/");
  $("#app").innerHTML = !S.view && s !== "home" ? loading() : s === "care" ? care() : s === "fixing" ? fixing() : s === "inbox" ? inbox() : a === "note" ? noteScreen(id) : a === "cancel" ? cancelScreen(id) : a === "fix" ? fixScreen(id) : s === "sips" ? sipsPage() : a === "sip" ? sipPage(id) : a === "autopay" ? autopayPage(id) : s === "orders" ? ordersPage() : s === "support" ? supportPage() : s === "bank" ? bankPage() : a === "withdraw" ? withdrawPage(id) : home();
  wire();
}
function wire() {
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-note]").forEach(b => b.onclick = () => go("note/" + b.dataset.note));
  document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => send(TOPICS[+b.dataset.topic][2][S.lang] || TOPICS[+b.dataset.topic][2].en));
  document.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => send(b.dataset.ask));
  document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    const id = b.dataset.sip, s = sipOf(id), o = b.dataset.opt;
    if (o === "fix") { go("fix/" + id); runFlow({ kind: "fix", sip_id: id }); }
    if (o === "pause") pauseSheet(id);
    if (o === "cancel") go("cancel/" + id);
    if (o === "ask") { S.chat = []; go("care"); }
  });
  document.querySelectorAll("[data-sipask]").forEach(b => b.onclick = () => { S.chat = []; go("care"); const q = $("#q"); if (q) { q.value = `About my ${short(S.view, b.dataset.sipask)} SIP: `; q.focus(); } });
  document.querySelectorAll('input[name="cr"]').forEach(x => x.onchange = () => { $("#crGo").disabled = false; });
  if ($("#crGo")) {
    const id = screen.split("/")[1];
    const res = S.flowRes["cancel_reason:" + id];
    if (res && res.flow) { const x = document.querySelector(`input[name="cr"][value="${res.flow.reason}"]`); if (x) { x.checked = true; $("#crGo").disabled = false; } if (res.flow.text && !$("#crText").value) $("#crText").value = res.flow.text; }
    $("#crGo").onclick = async () => { const r = document.querySelector('input[name="cr"]:checked'); if (!r) return; const text = $("#crText").value.trim(); await runFlow({ kind: "cancel_reason", sip_id: id, reason: r.value, text }); const el = $("#crRes"); if (el) el.scrollIntoView({ behavior: "smooth" }); };
    $("#crSkip").onclick = () => proposeAndConfirm({ type: "stop_sip", sip_id: id });
  }
  document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => {
    const id = b.dataset.sip, k = b.dataset.page;
    if (k === "date") proposeAndConfirm({ type: "change_date", sip_id: id, day: +$("#newDay").value });
    if (k === "amount") proposeAndConfirm({ type: "change_amount", sip_id: id, amount: +$("#newAmt").value });
    if (k === "skip") proposeAndConfirm({ type: "skip_next", sip_id: id });
    if (k === "resume") proposeAndConfirm({ type: "resume", sip_id: id });
    if (k === "autopay") proposeAndConfirm({ type: "setup_autopay", sip_id: id, limit: +b.dataset.limit || undefined });
    if (k === "pay") proposeAndConfirm({ type: "pay_now", sip_id: id });
    if (k === "withdraw") proposeAndConfirm({ type: "redeem", sip_id: id, amount: +$("#wdAmt").value });
    if (k === "withdraw_all") proposeAndConfirm({ type: "redeem", sip_id: id, all: true });
    if (k === "ticket") proposeAndConfirm({ type: "send_ticket", sip_id: $("#tkSip").value, subject: $("#tkSub").value || "Support request", body: $("#tkBody").value });
  });
  document.querySelectorAll("[data-restart]").forEach(b => b.onclick = async () => { await start(true, b.dataset.restart); go("home"); });
  document.querySelectorAll("[data-sit]").forEach(b => b.onclick = async () => { b.disabled = true; const r = await post("/api/agent/situation", { session_id: S.session, kind: b.dataset.sit }); apply(r); if (r.ok && r.fresh && r.fresh.length) { announce(r.fresh); window.scrollTo(0, 0); } else if (r.ok) toast({ title: "Nothing changed", notify: r.note || "That situation can't apply right now." }); render(); });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const a = b.dataset.act;
    if (a === "reset") { await start(true); go("home"); }
    if (a === "toggle") { apply(await post("/api/agent/settings", { session_id: S.session, autoplay: !S.view.autoplay })); S.lastTickAt = Date.now(); render(); }
    if (a === "alerts") enableAlerts();
    if (a === "topics") { S.chat = []; render(); window.scrollTo(0, 0); }
  });
  document.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => send(b.dataset.chip));
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = async () => { S.lang = b.dataset.lang; store.set("sipcare_lang", S.lang); apply(await post("/api/agent/settings", { session_id: S.session, lang: S.lang })); render(); });
  document.querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => openConfirm([b.dataset.confirm]));
  document.querySelectorAll("[data-decline]").forEach(b => b.onclick = async () => { const id = b.dataset.decline; const r = await post("/api/agent/decline", { session_id: S.session, proposal_id: id }); if (r.ok) { S.pending = r.pending; if (r.view) S.view = r.view; S.chat.forEach(it => { if (it.kind === "answer") { it.states = it.states || {}; if ((it.r.proposals || []).some(p => p.id === id)) it.states[id] = "declined"; } }); S.flowDone[id] = "declined"; render(); } });
  const f = $("#ask"); if (f) f.onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { $("#q").value = ""; send(q); } };
  const fb = {}; document.querySelectorAll("#fb [data-k]").forEach(b => b.onclick = () => { fb[b.dataset.k] = b.dataset.v; document.querySelectorAll(`#fb [data-k="${b.dataset.k}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); });
  const fs = $("#fbSend"); if (fs) fs.onclick = async () => { if (!fb.understood || !fb.fixed || !fb.clarity) { $("#fbMsg").textContent = "Please answer all three."; return; } const r = await post("/api/agent/feedback", Object.assign({ session_id: S.session }, fb)); if (r.ok) { S.fbDone = true; store.set("sipcare_fb", "1"); render(); } else $("#fbMsg").textContent = r.error || "Couldn't save."; };
}

(async () => {
  render();
  if ("serviceWorker" in navigator && store.get("sipcare_push") === "1") navigator.serviceWorker.register("/sw.js").catch(() => {});
  const h0 = location.hash.replace(/^#\//, "");
  // A fresh visit or refresh starts a new demo on the SIP date with a new problem; opening from a notification keeps the session.
  if (await start(!h0.startsWith("note/"))) { screen = h0.startsWith("note/") && ROUTES.test(h0) ? h0 : "home"; try { history.replaceState(null, "", location.pathname + location.search + (screen === "home" ? "#/" : "#/" + screen)); } catch (e) {} render(); }
})();
</script>
