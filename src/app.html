<!doctype html>

<title>Groww SIP Care · Concept</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.msi{width:22px;height:22px;display:inline-block;vertical-align:middle;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msi.fill{fill:currentColor;stroke:none}
.msi.fill .cut{stroke:var(--card);fill:none;stroke-width:2.2}
.chip .msi{width:14px;height:14px}.sc .msi{width:16px;height:16px}.receipt .msi{width:18px;height:18px}.step .b .msi{width:16px;height:16px}.halo .msi{width:40px;height:40px}
nav.bottom .msi{width:22px;height:22px}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin .8s linear infinite}
.phone{max-width:430px;min-height:100vh;margin:0 auto;background:var(--card);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--line)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid transparent}
.top.inner{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.word{font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--green)}
.concept{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--subtle);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--subtle);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--card)}
.ttl{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
main{flex:1;padding:4px 16px 96px;display:flex;flex-direction:column;gap:14px}
h2{font-size:20px;margin:6px 0 0;font-weight:600}
h3{font-size:16px;margin:0;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.value .big{font-size:26px;font-weight:600;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px}
.ok{color:var(--green-ink);background:var(--green-bg)}.warn{color:var(--amber);background:var(--amber-bg)}.info{color:var(--blue);background:var(--blue-bg)}.mutedc{color:var(--muted);background:var(--subtle)}

.success{background:var(--green-bg);border:0}
.agentbadge{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.sc{width:26px;height:26px;border-radius:8px;background:var(--green);color:var(--on);display:flex;align-items:center;justify-content:center}
.aitag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--green-ink);background:var(--green-bg);border-radius:6px;padding:2px 6px}
.stdtag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--subtle);border-radius:6px;padding:2px 6px}
.newtag{font-size:10px;font-weight:700;color:var(--on);background:var(--green);border-radius:5px;padding:1px 5px;margin-left:6px}
.btn{height:46px;border-radius:10px;border:0;background:var(--green);color:var(--on);font:inherit;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.sec{background:transparent;color:var(--green-ink);border:1px solid var(--green)}
.btn.ghost{background:transparent;color:var(--muted)}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.qa button{background:none;border:0;color:var(--ink);font:inherit;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default}

.qa .tile{width:50px;height:50px;border-radius:14px;background:var(--subtle);display:flex;align-items:center;justify-content:center;color:var(--green-ink);position:relative}
.qa .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.row{display:flex;align-items:center;gap:12px}
.fund{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}
.fi{width:40px;height:40px;border-radius:10px;background:var(--subtle);color:var(--green-ink);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.fund .name{font-weight:500;font-size:14px}
.sectionh{display:flex;justify-content:space-between;align-items:center}
.link{color:var(--green-ink);font-weight:600;font-size:13px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
nav.bottom{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}

.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px}
.msg.user{align-self:flex-end;background:var(--green);color:var(--on);border-bottom-right-radius:4px}
.msg.agent{align-self:flex-start;background:var(--subtle);border-bottom-left-radius:4px}
.msg .meta{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.receipt{align-self:flex-start;font-size:13px;color:var(--green-ink);display:flex;gap:6px;align-items:flex-start}
.notice{font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:10px;padding:8px 10px}
.prop{border:1px solid var(--green);background:var(--green-bg);border-radius:12px;padding:12px;align-self:stretch}
.prop.danger{border-color:var(--line);background:var(--subtle)}
.prop .t{font-weight:600;font-size:14px}
.prop .s{font-size:13px;color:var(--muted);margin-top:2px}
.composer{position:sticky;bottom:64px;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:15}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.inp{display:flex;gap:8px}
.inp input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--subtle);color:var(--ink);font:inherit;padding:0 12px}
.inp button{width:44px;height:44px;border-radius:12px;border:0;background:var(--green);color:var(--on);cursor:pointer}
.lang{display:flex;background:var(--subtle);border-radius:999px;padding:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:5px 8px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,20,25,.45)}
.sheet{width:100%;max-width:430px;background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px 20px;max-height:88vh;overflow:auto}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.kv{border:1px solid var(--line);border-radius:12px;margin-top:10px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13px;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:500;text-align:right}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex:none}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:10px;align-items:flex-start;animation:rise .35s ease both}
.step .b{width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 0}
.halo{width:80px;height:80px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;color:var(--green)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.fb button.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.fb button.opt[aria-pressed=true]{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.foot{display:flex;justify-content:center;gap:16px;padding:4px 0 8px}
.hidden{display:none!important}

.nbadge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--card)}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green-bg);border-radius:12px;padding:10px 12px;margin-top:4px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent);animation:pl 1.8s infinite;flex:none}
.pulse.off{animation:none;background:var(--muted)}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;height:32px;padding:0 10px;font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.pill .msi{width:16px;height:16px}
.obs{display:flex;gap:10px;align-items:flex-start;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer;text-align:left}
.obs.needs{border-color:var(--amber)}
.issue .obs{background:var(--card)}
.oi{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.oi .msi{width:18px;height:18px}
.obs .chev{width:18px;height:18px;color:var(--muted);margin-top:8px}
.trace{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.trace span{display:inline-flex;align-items:center;gap:4px}
.trace span i{display:inline-block;width:14px;height:1px;background:var(--line);margin-right:2px}
.trace span b{width:18px;height:18px;border-radius:50%;background:var(--subtle);display:inline-flex;align-items:center;justify-content:center}
.trace span b .msi{width:12px;height:12px}
.trace span.on{color:var(--green-ink);font-weight:600}.trace span.on b{background:var(--green);color:var(--on)}
.an{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.an h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.an h4 .msi{width:16px;height:16px}
.an p{margin:0;font-size:14px}
.an ul{margin:0;padding-left:18px;font-size:14px}.an li{margin:3px 0}
.an.needs{border-color:var(--green);background:var(--green-bg)}
.an .receipt{margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--muted)}
.dayh{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
#toasts{position:fixed;top:8px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px}
.toast{pointer-events:auto;width:100%;max-width:410px;display:flex;gap:10px;align-items:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);font:inherit;cursor:pointer;animation:drop .35s ease both;transition:opacity .4s,transform .4s}
.toast b{display:block;font-size:13px}.toast span span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.dotu{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none;margin-top:6px}
.top .ttl .aitag{margin-left:2px}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.topic{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:13px;font-weight:600;text-align:left;cursor:pointer;min-height:56px}
.topic .oi{background:var(--green-bg);color:var(--green-ink)}
.topic:active{background:var(--subtle)}
.ans{align-self:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ans .hd{display:flex;gap:6px;align-items:center;padding:10px 12px;background:var(--subtle);font-size:12px;font-weight:600}
.ans .bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.ans h4{margin:0 0 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.ans h4 .msi{width:14px;height:14px}
.ans ul{margin:0;padding-left:18px;font-size:13px}.ans li{margin:2px 0}
.ans p{margin:0;font-size:14px}
.work{align-self:stretch;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.work div{display:flex;gap:8px;align-items:center;color:var(--muted)}.work div.on{color:var(--ink)}.work div.ok{color:var(--green-ink)}
.work .msi{width:16px;height:16px}
.fups{display:flex;gap:6px;flex-wrap:wrap}
.fups button{border:1px solid var(--green);background:var(--card);color:var(--green-ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pf div span{display:block;font-size:12px;color:var(--muted)}.pf div b{font-size:15px}
.up{color:var(--green-ink)}.down{color:#d55}
.sipmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--muted)}

details.tester{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px}
details.tester summary{cursor:pointer;font-weight:600;font-size:14px}
</style>
</head>

    ${empty ? `<div class="topics">${TOPICS.map((t, i) => `<button class="topic" data-topic="${i}"><span class="oi">${ic(t[0])}</span>${t[1]}</button>`).join("")}</div>` : ""}
    <div class="thread">${S.chat.map(renderChat).join("")}${S.busy ? workBox() : ""}</div>
    ${!empty && !S.busy ? `<button class="link" data-act="topics" style="align-self:flex-start">${ic("help")} Ask about something else</button>` : ""}
  </main>
  <div class="composer">
    <form class="inp" id="ask"><input id="q" maxlength="500" autocomplete="off" placeholder="Ask anything about your SIPs" aria-label="Message SIP Care"><button aria-label="Send">${ic("send")}</button></form>
    <div class="muted" style="font-size:11px">Don't share PAN, account numbers, OTP or PIN. SIP Care never asks for them.</div></div>
  ${navBar()}`;
}
function workBox() {
  const L = ["Reading your SIPs, payments and orders", "Checking SIP rules and app guidelines", "Working out your answer"];
  return `<div class="work">${L.map((t, i) => `<div class="${i < S.work ? "ok" : i === S.work ? "on" : ""}">${i < S.work ? ic("check_circle") : i === S.work ? ic("progress_activity") : ic("schedule")}${t}</div>`).join("")}</div>`;
}
function answerCard(it) {
  const r = it.r;
  return `<div class="ans"><div class="hd"><span class="sc" style="width:20px;height:20px;border-radius:6px">${ic("shield_with_heart")}</span>SIP Care · ${esc(TOPIC_LABEL[r.topic] || "Answer")}<span style="flex:1"></span>${r.used_ai ? '<span class="aitag">AI</span>' : '<span class="stdtag">Standard</span>'}</div><div class="bd">
    ${r.found && r.found.length ? `<div><h4>${ic("analytics")} What I found in your account</h4><ul>${r.found.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
    <div><h4>${ic("verified_user")} Answer</h4><p>${esc(r.answer)}</p></div>
    ${r.next && r.next.length ? `<div><h4>${ic("schedule")} What happens next</h4><ul>${r.next.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
    ${(r.done || []).length ? `<div><h4>${ic("check_circle")} Done automatically</h4>${r.done.map(d => `<div class="receipt">${ic("check_circle", "fill")}<span>${esc(d)}</span></div>`).join("")}</div>` : ""}
    ${(r.skipped || []).length ? `<div><h4>${ic("info")} Not possible</h4>${r.skipped.map(k => `<div class="muted">• ${esc(k.why)}</div>`).join("")}</div>` : ""}
    ${(r.proposals || []).length ? `<div><h4>${ic("task_alt")} Needs your OK</h4><div style="display:flex;flex-direction:column;gap:8px">${r.proposals.map(p => propState(p, it)).join("")}</div></div>` : ""}
    ${r.followups && r.followups.length && it.last ? `<div class="fups">${r.followups.map(f => `<button data-chip="${esc(f)}">${esc(f)}</button>`).join("")}</div>` : ""}
  </div></div>`;
}
function propState(p, it) {
  const still = S.pending.some(x => x.id === p.id);
  if (still) return propCard(p);
  const st = (it.states || {})[p.id];
  return `<div class="prop"><div class="t">${esc(p.title)}</div><div class="muted" style="margin-top:4px">${st === "declined" ? "Not done" : st === "done" ? "✓ Done" : "No longer needed"}</div></div>`;
}
function propCard(p) {
  return `<div class="prop ${p.danger ? "danger" : ""}"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.summary)}</div><div class="row" style="gap:8px;margin-top:10px"><button class="btn" style="height:38px" data-confirm="${p.id}">Review &amp; confirm</button><button class="btn ghost" style="height:38px;width:auto;padding:0 12px" data-decline="${p.id}">Not now</button></div></div>`;
}
function renderChat(it, i) {
  if (it.kind === "user") return `<div class="msg user">${esc(it.text)}</div>`;
  if (it.kind === "answer") return answerCard(Object.assign(it, { last: i === S.chat.length - 1 }));
  if (it.kind === "notice") return `<div class="notice">${esc(it.text)}</div>`;
  return "";
}

// ---------------- INBOX ----------------
function inbox() {
  const v = S.view; if (!v) return loading();
  return `${topInner("Notifications")}<main>${v.inbox.length ? v.inbox.map(n => { const [i, t] = n.level === "alert" ? ["warning", "warn"] : ["radar", "ok"]; return `<button class="obs" data-note="${n.obs_id}"><span class="oi ${t}">${ic(i)}</span><span style="flex:1;text-align:left"><span class="row" style="justify-content:space-between"><b style="font-size:14px">SIP Care · ${esc(n.title)}</b><span class="muted" style="font-size:11px">${hm(n.at)}</span></span><span class="muted" style="display:block;margin-top:2px">${esc(n.body)}</span></span>${n.read ? "" : '<span class="dotu"></span>'}</button>`; }).join("") : `<div class="card success"><div class="row">${ic("check_circle", "fill")}<b>All quiet</b></div><div class="muted" style="margin-top:4px">SIP Care will notify you here when something changes on your SIPs.</div></div>`}</main>${navBar()}`;
}

// ---------------- CONFIRM + DONE ----------------
function openConfirm(ids) {
  const props = S.pending.filter(p => ids.includes(p.id));
  if (!props.length) return;
  const w = document.createElement("div"); w.className = "sheetwrap"; w.id = "sheet";
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfT"><div class="handle"></div>
    <div class="row" style="justify-content:space-between"><span class="chip ok">${ic("auto_fix_high")}AI agent</span><button class="iconbtn" style="background:none" id="cfX" aria-label="Close">${ic("close")}</button></div>
    <h3 id="cfT" style="font-size:20px;margin-top:8px">Confirm with SIP Care</h3>
    <p class="muted" style="font-size:14px">Nothing happens until you confirm.</p>
    ${props.map(p => `<label class="check"><input type="checkbox" data-pid="${p.id}" checked><div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(p.title)}</div><div class="muted">${esc(p.summary)}</div>${(p.rows || []).length ? `<div class="kv">${p.rows.map(([k, val]) => `<div><span>${esc(k)}</span><span>${esc(val)}</span></div>`).join("")}</div>` : ""}${p.note ? `<div class="notice" style="margin-top:8px;${p.danger ? "color:var(--muted);background:var(--subtle)" : ""}">${esc(p.note)}</div>` : ""}</div></label>`).join("")}
    <button class="btn" style="margin-top:14px" id="cfGo">${ic("bolt")} Confirm</button>
    <button class="btn ghost" style="margin-top:4px" id="cfBack">Go back</button></div>`;
  document.body.appendChild(w);
  const close = () => w.remove();
  w.addEventListener("click", e => { if (e.target === w) close(); });
  $("#cfX").onclick = close; $("#cfBack").onclick = close;
  $("#cfGo").onclick = async () => {
    const chosen = [...w.querySelectorAll("[data-pid]")].filter(x => x.checked).map(x => x.dataset.pid);
    if (!chosen.length) { close(); return; }
    $("#cfGo").disabled = true; $("#cfGo").innerHTML = `${ic("progress_activity")} SIP Care is working…`;
    const r = await post("/api/agent/confirm", { session_id: S.session, proposal_ids: chosen });
    close();
    if (!r.ok) { toast({ title: "Couldn't complete that", notify: r.error || "Please try again." }); return; }
    S.chat.forEach(it => { if (it.kind === "answer") chosen.forEach(id => { it.states = it.states || {}; it.states[id] = "done"; }); });
    S.pending = r.pending; S.view = r.view; S.steps = r.steps; S.lastFix = r.home_message;
    (r.failed || []).forEach(f => toast({ title: "Not possible", notify: `${f.title}: ${f.why}` }));
    go("fixing");
  };
}
function fixing() {
  return `${topInner(`SIP Care <span class="aitag">AI agent</span>`)}
  <main><div class="hero"><div class="halo">${ic("verified_user", "fill")}</div><h2>SIP Care is on it</h2><p class="muted" style="margin:0">You confirmed this</p></div>
    <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="muted" style="font-weight:500">Actions</span><span class="chip ok" id="cnt">0 / ${S.steps.length} complete</span></div><div class="steps" id="steps"></div></div>
    <div id="doneBox" class="hidden" style="display:flex;flex-direction:column;gap:10px">
      <div class="card success"><div class="row" style="font-weight:600;color:var(--green-ink)">${ic("check_circle", "fill")} Done.</div><div class="muted" style="margin-top:4px">SIP Care keeps checking and will notify you when it's complete.</div></div>
      <button class="btn" id="toHome">Back to Home ${ic("arrow_forward")}</button><button class="btn ghost" id="toCare">Back to SIP Care</button></div>
  </main>${navBar()}`;
}
function runSteps() {
  let n = 0;
  const t = setInterval(() => {
    if (!$("#steps")) { clearInterval(t); return; }
    if (n < S.steps.length) { $("#steps").insertAdjacentHTML("beforeend", `<div class="step"><span class="b">${ic("check")}</span><div style="font-size:14px;font-weight:500">${esc(S.steps[n])}</div></div>`); n++; $("#cnt").textContent = `${n} / ${S.steps.length} complete`; }
    else { clearInterval(t); $("#doneBox").classList.remove("hidden"); $("#toHome").onclick = () => go("home"); $("#toCare").onclick = () => go("care"); }
  }, 450);
}

// ---------------- notifications ----------------
function toast(o) {
  const el = document.createElement("button");
  el.className = "toast"; el.innerHTML = `<span class="sc">${ic("shield_with_heart")}</span><span style="flex:1;text-align:left"><b>${/^SIP Care/.test(o.title) ? "" : "SIP Care · "}${esc(o.title)}</b><span>${esc(o.notify)}</span></span>`;
  el.onclick = () => { el.remove(); if (o.id) go("note/" + o.id); };
  $("#toasts").appendChild(el);
  setTimeout(() => el.classList.add("out"), 6500); setTimeout(() => el.remove(), 7000);
}
async function systemNotify(o) {
  if (!("Notification" in window) || Notification.permission !== "granted" || document.visibilityState === "visible") return;
  try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) reg.showNotification((/^SIP Care/.test(o.title) ? "" : "SIP Care · ") + o.title, { body: o.notify, icon: "/icon.svg", tag: o.id, data: { url: "/#/note/" + o.id } }); } catch (e) {}
}
function announce(fresh) { (fresh || []).filter(o => !S.seenObs.has(o.id)).forEach(o => { S.seenObs.add(o.id); toast(o); systemNotify(o); }); }
async function enableAlerts() {
  const msg = t => { const m = $("#alertsMsg"); if (m) m.textContent = t; };
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) { msg("This browser doesn't support alerts. Use Chrome, Edge or Firefox; on iPhone, add this page to your Home Screen first."); return; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { msg("Alerts are blocked. Allow notifications for this site in your browser settings."); return; }
  try {
    const reg = await navigator.serviceWorker.register("/sw.js"); await navigator.serviceWorker.ready;
    const k = await (await fetch("/api/agent/push-key")).json();
    const key = Uint8Array.from(atob(k.key.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.key.length + 3) % 4)), c => c.charCodeAt(0));
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const r = await post("/api/agent/push-subscribe", { session_id: S.session, subscription: sub.toJSON() });
    if (!r.ok) throw new Error(r.error);
    store.set("sipcare_push", "1"); render();
    reg.showNotification("SIP Care alerts are on", { body: "SIP Care will alert you here when something changes on your SIPs, even with the app closed.", icon: "/icon.svg" });
  } catch (e) { msg("Couldn't turn on alerts: " + (e.message || e)); }
}

// ---------------- data + loop ----------------
function apply(r) { if (!r || !r.ok) return; S.view = r.view; S.pending = r.pending || []; if (r.gate) S.gate = r.gate; if (r.situations) S.situations = r.situations; if (r.next_tick_ms) S.nextTickMs = r.next_tick_ms; }
async function start(reset) {
  const r = await post("/api/agent/start", { session_id: reset ? "" : S.session, reset: !!reset, lang: S.lang });
  if (!r.ok) { $("#app").innerHTML = `<main><div class="notice" style="margin-top:20px">${esc(r.error || "Can't load the demo.")}</div></main>`; return false; }
  S.session = r.session_id; store.set("sipcare_session", r.session_id);
  if (reset) { S.chat = []; S.lastFix = null; S.fbDone = false; store.set("sipcare_fb", "0"); S.seenObs = new Set(); }
  apply(r); S.lastTickAt = Date.now();
  (r.view.observations || []).forEach(o => S.seenObs.add(o.id));
  return true;
}
async function tick(force) {
  if (!S.session) return;
  S.lastTickAt = Date.now();
  const r = await post("/api/agent/tick", { session_id: S.session, force: !!force });
  if (!r.ok) return;
  const hadSheet = !!$("#sheet"), typing = document.activeElement && document.activeElement.id === "q";
  apply(r); announce(r.fresh);
  if (!hadSheet && !typing && screen !== "fixing" && !S.busy) render();
}
setInterval(() => { if (S.view && S.view.autoplay && Date.now() - S.lastTickAt >= S.nextTickMs) tick(false); }, 2000);
window.addEventListener("hashchange", () => { const h = location.hash.replace(/^#\//, "") || "home"; if (h !== screen && S.view && (["care", "inbox", "home"].includes(h) || h.startsWith("note/"))) go(h); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view && S.view.autoplay) tick(false); });

async function send(message) {
  if (S.busy) return;
  if (screen !== "care") go("care");
  S.busy = true; S.work = 0; S.chat.push({ kind: "user", text: message }); render(); scrollEnd();
  const timer = setInterval(() => { if (S.work < 2) { S.work++; const w = document.querySelector(".work"); if (w) w.outerHTML = workBox(); } }, 700);
  const r = await post("/api/agent/message", { session_id: S.session, message, lang: S.lang });
  clearInterval(timer); S.busy = false;
  if (!r.ok) { S.chat.push({ kind: "notice", text: r.error || "Something went wrong." }); render(); return; }
  if (r.shown) { const u = [...S.chat].reverse().find(x => x.kind === "user"); if (u) u.text = r.shown; }
  if (r.redacted && r.redacted.length) S.chat.push({ kind: "notice", text: `We removed what looked like your ${r.redacted.join(", ")}. Please don't share these.` });
  if (r.notice) S.chat.push({ kind: "notice", text: r.notice });
  S.chat.push({ kind: "answer", r });
  S.pending = r.pending; S.view = r.view; render(); scrollEnd();
}

// ---------------- router ----------------
let screen = "home", backStack = [];
function go(s) {
  if (s === "back") { s = backStack.pop() || "home"; } else if (s !== screen) backStack.push(screen);
  if (s === "home") backStack = [];
  screen = s; try { history.replaceState(null, "", s === "home" ? "#/" : "#/" + s); } catch (e) {}
  if (s.startsWith("note/")) markRead(s.slice(5));
  if (s === "inbox") post("/api/agent/settings", { session_id: S.session, read: "all" }).then(apply);
  render(); window.scrollTo(0, 0); if (s === "fixing") runSteps();
}
function markRead(obsId) { const v = S.view; if (!v) return; const ids = v.inbox.filter(n => n.obs_id === obsId && !n.read).map(n => n.id); if (ids.length) post("/api/agent/settings", { session_id: S.session, read: ids }).then(r => { apply(r); }); }
function loading() { return `<main><div class="hero" style="margin-top:40vh"><span class="typing"><i></i><i></i><i></i></span></div></main>`; }
function scrollEnd() { setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 30); }
function render() {
  const s = screen;
  $("#app").innerHTML = s === "care" ? care() : s === "fixing" ? fixing() : s === "inbox" ? inbox() : s.startsWith("note/") ? noteScreen(s.slice(5)) : home();
  wire();
}
function wire() {
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-note]").forEach(b => b.onclick = () => go("note/" + b.dataset.note));
  document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => send(TOPICS[+b.dataset.topic][2][S.lang] || TOPICS[+b.dataset.topic][2].en));
  document.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => send(b.dataset.ask));
  document.querySelectorAll("[data-sit]").forEach(b => b.onclick = async () => { b.disabled = true; const r = await post("/api/agent/situation", { session_id: S.session, kind: b.dataset.sit }); apply(r); if (r.ok && r.fresh && r.fresh.length) { announce(r.fresh); window.scrollTo(0, 0); } else if (r.ok) toast({ title: "Nothing changed", notify: r.note || "That situation can't apply right now." }); render(); });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const a = b.dataset.act;
    if (a === "reset") { await start(true); go("home"); }
    if (a === "toggle") { apply(await post("/api/agent/settings", { session_id: S.session, autoplay: !S.view.autoplay })); S.lastTickAt = Date.now(); render(); }
    if (a === "alerts") enableAlerts();
    if (a === "topics") { S.chat = []; render(); window.scrollTo(0, 0); }
  });
  document.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => send(b.dataset.chip));
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = async () => { S.lang = b.dataset.lang; store.set("sipcare_lang", S.lang); apply(await post("/api/agent/settings", { session_id: S.session, lang: S.lang })); render(); });
  document.querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => openConfirm([b.dataset.confirm]));
  document.querySelectorAll("[data-decline]").forEach(b => b.onclick = async () => { const id = b.dataset.decline; const r = await post("/api/agent/decline", { session_id: S.session, proposal_id: id }); if (r.ok) { S.pending = r.pending; if (r.view) S.view = r.view; S.chat.forEach(it => { if (it.kind === "answer") { it.states = it.states || {}; if ((it.r.proposals || []).some(p => p.id === id)) it.states[id] = "declined"; } }); render(); } });
  const f = $("#ask"); if (f) f.onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { $("#q").value = ""; send(q); } };
  const fb = {}; document.querySelectorAll("#fb [data-k]").forEach(b => b.onclick = () => { fb[b.dataset.k] = b.dataset.v; document.querySelectorAll(`#fb [data-k="${b.dataset.k}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); });
  const fs = $("#fbSend"); if (fs) fs.onclick = async () => { if (!fb.understood || !fb.fixed || !fb.clarity) { $("#fbMsg").textContent = "Please answer all three."; return; } const r = await post("/api/agent/feedback", Object.assign({ session_id: S.session }, fb)); if (r.ok) { S.fbDone = true; store.set("sipcare_fb", "1"); render(); } else $("#fbMsg").textContent = r.error || "Couldn't save."; };
}

(async () => {
  render();
  if ("serviceWorker" in navigator && store.get("sipcare_push") === "1") navigator.serviceWorker.register("/sw.js").catch(() => {});
  if (await start(false)) { const h = location.hash.replace(/^#\//, ""); screen = ["care", "inbox"].includes(h) || h.startsWith("note/") ? h : "home"; render(); }
})();
</script>

</body>
</html>
