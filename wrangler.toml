name = "groww-sip-discovery"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Keep variables set in the Cloudflare dashboard when GitHub deploys (the Gemini key is a Secret set only in Cloudflare).
keep_vars = true

[vars]
MODEL = "gemini-3.5-flash-lite"

[[d1_databases]]
binding = "DB"
database_name = "sip-recovery"
database_id = "42364513-60ae-45b7-91ac-8359b999d2f3"

[triggers]
crons = ["* * * * *"]
